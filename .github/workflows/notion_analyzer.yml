name: Garmin Notion Analyzer

on:
  schedule:
    # GitHub Actions 目前支援 IANA timezone；每天台灣時間 20:00 執行。
    - cron: "0 20 * * *"
      timezone: "Asia/Taipei"
  workflow_dispatch:

concurrency:
  group: garmin-notion-daily-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # 作為 OS 層的備援；主程式也會使用 APP_TIMEZONE 明確計算日期。
      TZ: Asia/Taipei
      APP_TIMEZONE: Asia/Taipei
      START_DATE: auto
      END_DATE: auto
      SYNC_DAYS_BACK: "2"
      NOTION_VERSION: "2022-06-28"
      STORE_DETAIL_JSON_BLOCKS: "true"
      MAX_HR: ${{ secrets.MAX_HR }}
      REST_HR: ${{ secrets.REST_HR }}
      WEIGHT_KG: ${{ secrets.WEIGHT_KG }}
      GARMIN_JITTER_MIN_SECONDS: "30"
      GARMIN_JITTER_MAX_SECONDS: "45"
      GARMINTOKENS: ${{ github.workspace }}/.garminconnect
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_RAW_ACTIVITIES_DB_ID: ${{ secrets.NOTION_RAW_ACTIVITIES_DB_ID }}
      NOTION_RAW_LAPS_DB_ID: ${{ secrets.NOTION_RAW_LAPS_DB_ID }}
      NOTION_RAW_DETAIL_DB_ID: ${{ secrets.NOTION_RAW_DETAIL_DB_ID }}
      NOTION_ANALYSIS_DB_ID: ${{ secrets.NOTION_ANALYSIS_DB_ID }}
      NOTION_WEEKLY_DB_ID: ${{ secrets.NOTION_WEEKLY_DB_ID }}
      GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
      GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
      # 已由 GARMIN_TOKEN_JSON 改名為 GARMIN_AUTH_TOKEN，跟 garmin-to-Notion-New 統一命名。
      # 現在只在D1的credentials表是空的時候(例如第一次執行)當作起始值，
      # 平常執行時 main.py 會優先讀取D1裡兩個repo共用的最新token，登入後再寫回D1。
      GARMIN_AUTH_TOKEN: ${{ secrets.GARMIN_AUTH_TOKEN }}
      # Cloudflare D1：跟 garmin-to-Notion-New 共用同一個資料庫(linebot-db)
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Verify Taiwan local date
        run: |
          echo "GitHub runner UTC: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Taiwan local time: $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S %Z')"
          uv run python -c "from src.main import app_today; print('Application date:', app_today().isoformat())"

      - name: Run Garmin daily sync and Notion weekly update
        run: uv run python src/main.py
